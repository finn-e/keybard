name: Package Keybard Overlay release

# Every release tag packages Keybard Overlay (the CMD/ZIP package, keybard-paranoid.html
# and checksums) into a GitHub release named after the tag:
#
#   x tags (x3, x3.1): a published GitHub prerelease, for the bleeding edge.
#   v tags (v3, v3.1): a draft full release. A person tests the Windows ZIP and
#     publishes it; HOST_RELEASE_TAG in src/features/trainer/HostInstall.tsx
#     must already name the tag.
#
# Both must be on main. Tag rules: .github/scripts/release-tag.sh. To package an
# existing tag again (delete its release first):
#
#   gh workflow run keybard-overlay-release.yml -R svalboard/keybard -f tag=<tag>
#
# The linux job adds the Linux test package (AppImage, .tar.gz, README-LINUX.md, the
# udev rule and SHA256SUMS-Linux.txt) to the same release. To try the Linux build
# from a branch without releasing anything, run a dry run: it builds the branch and
# keeps the files as workflow artifacts only.
#
#   gh workflow run keybard-overlay-release.yml -R <repo> --ref <branch> -f tag=dry-run -f dry_run=true

on:
  push:
    # Glob prefilters; release-tag.sh applies the exact rule.
    tags: ['v[0-9]*', 'x[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package, e.g. v3 (release) or x3 (prerelease)
        required: true
        type: string
      dry_run:
        description: Linux only, from the chosen branch, kept as workflow artifacts; no release, no tag checks (tag is ignored)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'svalboard/keybard' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          fetch-depth: 0
      - name: Only a release (v) or prerelease (x) tag
        run: echo "RELEASE_KIND=$(bash .github/scripts/release-tag.sh "$RELEASE_TAG")" >> "$GITHUB_ENV"
      - name: The tag is on main
        run: bash .github/scripts/on-main.sh "$RELEASE_TAG"
      - name: A full release is the Host release Keybard offers
        if: env.RELEASE_KIND == 'release'
        run: |
          offered=$(sed -n "s/^export const HOST_RELEASE_TAG = '\([^']*\)'.*/\1/p" src/features/trainer/HostInstall.tsx)
          [ "$offered" = "$RELEASE_TAG" ] || { echo "::error::HOST_RELEASE_TAG is '$offered', not $RELEASE_TAG (src/features/trainer/HostInstall.tsx)"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: PYTHONPATH=companion/overlay-host python -m unittest discover -s companion/overlay-host/tests -q
      - run: npm run build:svalboard
      - run: npm run build:paranoid
      - name: Package, stamped with the release and the Keybard commit it bundles
        env:
          KEYBARD_HOST_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          echo "KEYBARD_COMMIT=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          KEYBARD_COMMIT=$(git rev-parse --short=7 HEAD) python companion/overlay-host/scripts/package.py
      - name: Release notes with this build's Keybard
        run: |
          cp companion/overlay-host/RELEASE-NOTES.md dist/RELEASE-NOTES.md
          {
            echo
            echo "## This build"
            echo
            echo "- Bundles Keybard built from commit \`$KEYBARD_COMMIT\` (each Keybard page shows its commit in the corner)."
            echo "- Keybard Overlay reports its release and bundled Keybard in Keybard's Overlay dialog and in its tray tooltip."
          } >> dist/RELEASE-NOTES.md
      - name: Checksum
        working-directory: dist
        run: sha256sum KeybardOverlay-Windows.zip > SHA256SUMS.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist-paranoid/keybard-paranoid.html dist/
          (cd dist && sha256sum keybard-paranoid.html >> SHA256SUMS.txt)
          if [ "$RELEASE_KIND" = release ]; then
            # A person tests the Windows ZIP, then publishes the draft.
            kind=(--draft)
          else
            kind=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/KeybardOverlay-Windows.zip dist/keybard-paranoid.html dist/SHA256SUMS.txt \
            --verify-tag "${kind[@]}" --title "Keybard Overlay $RELEASE_TAG" \
            --notes-file dist/RELEASE-NOTES.md

  linux:
    # Keybard Overlay for Linux, built on Ubuntu 22.04 so it runs on glibc 2.34 and later
    # systems (Qt's wheels set that floor), and added to the release the package job made.
    needs: package
    if: >-
      always() && (inputs.dry_run == true ||
      (github.repository == 'svalboard/keybard' && needs.package.result == 'success'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run == true && 'true' || '' }}
      DL: ${{ github.workspace }}/../overlay-linux-downloads
      OUT: ${{ github.workspace }}/dist-linux
    steps:
      - uses: actions/checkout@v5
        with:
          # A release builds its tag; a dry run builds the branch it was started on.
          ref: ${{ inputs.dry_run != true && format('refs/tags/{0}', github.event_name == 'push' && github.ref_name || inputs.tag) || '' }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: X libraries the package bundles as fallbacks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-util1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libxkbfile1
      - uses: actions/cache@v4
        with:
          path: ${{ env.DL }}
          key: overlay-linux-${{ hashFiles('companion/overlay-host/packaging/linux/fetch.sh', 'companion/overlay-host/packaging/linux/requirements-linux.txt') }}
      - name: Pinned downloads, SHA-256 checked
        run: bash companion/overlay-host/packaging/linux/fetch.sh
      - run: npm ci
      - run: npm run build:svalboard
      - run: npm run build:paranoid
      - name: Package, stamped with the release and the Keybard commit it bundles
        run: |
          commit=$(git rev-parse --short=7 HEAD)
          version=$RELEASE_TAG
          [ -n "$DRY_RUN" ] && version="dry-run-$commit"
          KEYBARD_HOST_VERSION=$version KEYBARD_COMMIT=$commit WORK=$RUNNER_TEMP/overlay-linux-work \
            bash companion/overlay-host/packaging/linux/build.sh
      - name: The package starts and reports itself
        run: |
          tar -xzf "$OUT/KeybardOverlay-Linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/KeybardOverlay/keybard-overlay" --diagnose | tee diagnose.txt
          grep -q 'Qt WebEngine: importable' diagnose.txt
          grep -q 'HID backend: hidraw' diagnose.txt
      - name: Keep the files (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keybard-overlay-linux
          path: ${{ env.OUT }}
          retention-days: 7
      - name: Add the Linux files to the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.OUT }}
        run: |
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber \
            KeybardOverlay-x86_64.AppImage KeybardOverlay-Linux-x86_64.tar.gz \
            SHA256SUMS-Linux.txt README-LINUX.md 60-svalboard.rules install-udev-rule.sh
