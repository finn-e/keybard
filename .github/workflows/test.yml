name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  overlay-host:
    # Keybard Overlay's Python tests, with Qt (offscreen) so the Qt tests run too.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Libraries Qt WebEngine needs
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libasound2t64 libxkbfile1 libegl1 libxkbcommon0
    - run: pip install -r companion/overlay-host/requirements.txt
    - name: Python tests
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONPATH: companion/overlay-host
      run: python -m unittest discover -s companion/overlay-host/tests -v

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      if: matrix.node-version == '24.x'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage/coverage-final.json
        flags: unittests
        name: codecov-keybard
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Generate coverage report
      if: matrix.node-version == '24.x'
      run: |
        echo "## Test Coverage Report 📊" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        npx vitest run --coverage --reporter=verbose 2>/dev/null | grep -A 10 "Coverage report" || true
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY


    - name: Check coverage thresholds
      if: matrix.node-version == '24.x'
      run: |
        COVERAGE_OUTPUT=$(npx vitest run --coverage 2>&1)
        if echo "$COVERAGE_OUTPUT" | grep -q "Coverage threshold not met"; then
          echo "❌ Coverage is below the required 90% threshold"
          exit 1
        else
          echo "✅ Coverage meets the required threshold"
        fi